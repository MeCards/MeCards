# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Preview

on:
  pull_request:
    types:
      - closed
      - labeled
      - reopened
      - synchronize
      - unlabeled
  release:
    types:
      - deleted
      - prereleased
      - released

env:
  LABEL: needs:preview

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-slim

    outputs:
      action: ${{ steps.decide.outputs.action }}
      branch: ${{ steps.decide.outputs.branch }}
      sha: ${{ steps.decide.outputs.sha }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Decide action
        id: decide
        env:
          BASE_REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          action=none

          if [ "$EVENT_NAME" = release ]; then
            # Tag names may contain shell metacharacters, so sanitize before using as a branch name
            branch="prerelease-$(printf '%s' "$RELEASE_TAG" | tr -c 'A-Za-z0-9.-' '-')"

            case "$EVENT_ACTION" in
              prereleased)
                action=deploy ;;
              # `released` also fires when a pre-release is promoted to a full release
              released|deleted)
                action=teardown ;;
            esac
          else
            branch="pr-${PR_NUMBER}"
            has_label=$(jq --arg l "$LABEL" 'index($l) != null' <<< "$PR_LABELS")

            # Fork PRs can't access secrets, so never act on them
            if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
              case "$EVENT_ACTION" in
                synchronize|reopened)
                  [ "$has_label" = true ] && action=deploy ;;
                labeled)
                  [ "$EVENT_LABEL" = "$LABEL" ] && action=deploy ;;
                closed)
                  [ "$has_label" = true ] && action=teardown ;;
                unlabeled)
                  [ "$EVENT_LABEL" = "$LABEL" ] && action=teardown ;;
              esac
            fi
          fi

          {
            echo "action=$action"
            echo "branch=$branch"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Decided: $action ($branch @ $SHA)"

  build:
    needs: gate
    if: needs.gate.outputs.action == 'deploy'

    permissions:
      contents: read

    runs-on: ubuntu-slim

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout commit (PR HEAD or Release tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Clean install dependencies
        run: npm ci --audit=false --ignore-scripts

      - name: Set version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm version "$RELEASE_TAG" --no-git-tag-version --ignore-scripts

      - name: Create prod build
        run: node --run build:prod

      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs
          if-no-files-found: error

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.action == 'deploy'

    concurrency:
      cancel-in-progress: false
      group: ${{ needs.gate.outputs.branch }}

    environment:
      name: ${{ needs.gate.outputs.branch }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}

    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-slim

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Validate Cloudflare config
        run: |
          test -n "${{ vars.CLOUDFLARE_PROJECT_NAME }}" || (echo "CLOUDFLARE_PROJECT_NAME is missing" && exit 1)
          test -n "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)

      - name: Download docs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs
          path: docs

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages deploy ./docs
            --branch=${{ needs.gate.outputs.branch }}
            --commit-dirty=true
            --commit-hash=${{ needs.gate.outputs.sha }}
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            🚀 **Preview deployed**
            - PR: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
            - Commit `${{ github.event.pull_request.head.sha }}`: ${{ steps.deploy.outputs.deployment-url }}

      - name: Summarize preview URL
        if: github.event_name == 'release'
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "🚀 **Preview deployed** for \`$TAG\`"
            echo "- Release: $ALIAS_URL"
            echo "- Deployment: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  teardown:
    needs: gate
    if: needs.gate.outputs.action == 'teardown'

    permissions:
      contents: read
      deployments: write
      pull-requests: write

    concurrency:
      cancel-in-progress: false
      group: ${{ needs.gate.outputs.branch }}

    runs-on: ubuntu-slim

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Delete preview deployments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        with:
          script: |
            const {
              BRANCH,
              CF_ACCOUNT_ID,
              CF_API_TOKEN,
              CF_PROJECT_NAME,
            } = process.env;
            const base = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments`;
            const headers = { Authorization: `Bearer ${CF_API_TOKEN}` };

            // Collect every preview deployment made for this PR's branch
            const ids = new Set();
            for (let page = 1; page <= 50; page++) {
              const res = await fetch(`${base}?env=preview&per_page=25&page=${page}`, { headers });
              const body = await res.json();
              if (!body.success) throw new Error(JSON.stringify(body.errors));
              if (body.result.length === 0) break;
              for (const d of body.result) if (d.deployment_trigger?.metadata?.branch === BRANCH) ids.add(d.id);
            }

            const failures = [];
            const successes = [];
            for (const id of ids) {
              // force=true is needed to delete a deployment that holds a branch alias
              const res = await fetch(`${base}/${id}?force=true`, { method: 'DELETE', headers });
              const body = await res.json();
              if (!body.success) failures.push(new Error(`Failed to delete ${id}`, { cause: body.errors }));
              else successes.push(id);
            }

            if (failures.length) throw new AggregateError(failures, 'Failed to delete preview(s)');

            core.info(`Successfully deleted all related previews: ${successes.join(', ')}`);

      - name: Deactivate GitHub deployments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ needs.gate.outputs.branch }}
        with:
          script: |
            const { ENVIRONMENT } = process.env;
            const { owner, repo } = context.repo;

            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              environment: ENVIRONMENT,
              per_page: 100,
            });

            for (const { id } of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: id,
                state: 'inactive',
              });
            }

      - name: Update comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: "🧹 Preview taken down."
