# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
  release:
    types:
      - released

permissions:
  contents: write

jobs:
  publish:
    name: Publish production build

    environment: Production

    runs-on: ubuntu-slim

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Clean install dependencies
        run: npm ci --audit=false --ignore-scripts

      - name: Set package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm version "$RELEASE_TAG" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "release: \`$RELEASE_TAG\`"
          git push origin HEAD:main

      - name: Create prod build
        run: node --run build:prod

      - name: Commit to GH Pages branch
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          git add -f ./docs
          git stash save 'prod build'
          git fetch origin prod
          git checkout prod
          git cherry-pick -n -m1 -Xtheirs stash@{0}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ./docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "release: ${VERSION}"
          git push origin prod
